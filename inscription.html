<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Digital - Learning Platform</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dark-theme">
    <div class="inscription">
      <div class="d-flex justify-content-center align-items-center">
        <img class="logo" src="./assets/futureslearn.png" alt="futureslearn" />
      </div>
      <div
        class="d-flex flex-column justify-content-center align-items-center mt-5"
      >
        <div
          class="d-flex justify-content-between align-items-start w-100 inscription-container"
        >
          <div
            class="d-flex align-items-center justify-content-center image-container"
          >
            <img src="./assets/inscription.png" alt="ecom-cart-logo" />
          </div>
          <div class="form-section w-100">
            <h2>Vos informations</h2>
            <div class="form-fields">
              <input
                type="email"
                class="form-control"
                placeholder="Adresse mail"
              />
              <input
                type="password"
                class="form-control"
                placeholder="Mot de passe"
              />
              <input
                type="date"
                class="form-control"
                placeholder="Date de naissance"
              />
              <input type="tel" class="form-control" placeholder="Téléphone" />
            </div>
            <div class="checkbox-group">
              <div class="custom-checkbox">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="termsCheckbox1"
                />
                <label class="form-check-label" for="termsCheckbox1">
                  En cochant cette case, vous déclarez avoir lu et accepté nos
                  conditions générales d'Utilisation du compte
                </label>
              </div>
              <div class="custom-checkbox">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="termsCheckbox2"
                />
                <label class="form-check-label" for="termsCheckbox2">
                  En cochant cette case, vous déclarez avoir lu et accepté nos
                  conditions d'achat et politique de remboursement
                </label>
              </div>
              <div class="custom-checkbox">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="termsCheckbox3"
                />
                <label class="form-check-label" for="termsCheckbox3">
                  Je souhaite être informé(e) des opportunités et offres de
                  Futures Learn
                </label>
              </div>
            </div>
            <button class="button w-100">Créer votre compte</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
