    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="dark-theme" style="height: 100%; overflow: visible">
    <div class="inscription-formation w-100">
      <div class="d-flex justify-content-center align-items-center w-100 mt-5">

        <div class="content-container">

                src="./assets/inscription-formation/mockup formation ecom 1.png"

              />
              <div class="price mt-3">79.99€</div>
            </div>
            <div
              class="d-flex flex-column justify-content-center align-items-center gap-3 price-cart"
            >
              <img
                src="./assets/inscription-formation/logo learnfinance@4x-8 1.png"
                alt=""
              />
              <img
                src="./assets/inscription-formation/mockup finance copy 1.png"
                alt=""
              />
              <div class="mt-3">
                <p>à partir de</p>
                <div class="price">79.99€</div>
                <p>par mois</p>
              </div>
            </div>
            <div
              class="d-flex flex-column justify-content-center align-items-center gap-3 price-cart"
            >
              <img
                src="./assets/inscription-formation/LearnDigital logo@2x.png"
                alt=""
              />
              <img
                src="./assets/inscription-formation/mockup formation ecom 2.png"
                alt=""
              />
              <div class="price mt-3">79.99€</div>
            </div>
          </div>

      </div>
